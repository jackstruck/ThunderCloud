openapi: 3.1.0
info:
  title: ThunderCloud Face Console
  version: 0.4.0
  description: Search, enrollment, and subject management API. IAP authentication is required for every operation.
servers:
  - url: /
security:
  - iap: []
paths:
  /api/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Run created, or the identical idempotent request replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/runs/recent:
    get:
      operationId: listRecentRuns
      description: The signed-in principal's latest ten non-expired runs, newest first.
      responses:
        '200':
          description: Recent runs belonging to the authenticated principal.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    maxItems: 10
                    items: {$ref: '#/components/schemas/Run'}
        '429': {$ref: '#/components/responses/Error'}
  /api/runs/{run_id}:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      operationId: getRun
      responses:
        '200':
          description: Safe status visible to every approved internal user.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/runs/{run_id}/upload-session:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      operationId: createUploadSession
      description: Initiates a CSEK upload; the bearer session URI must never be logged or persisted.
      responses:
        '201':
          description: Scoped resumable upload session.
          content:
            application/json:
              schema:
                type: object
                required: [session_uri]
                properties:
                  session_uri: {type: string, format: uri}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/sources/{source_id}:
    parameters:
      - name: source_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteRetainedSource
      description: Tombstones and schedules exact-generation deletion without removing derived lineage.
      responses:
        '202':
          description: Source tombstoned and deletion queued.
        '404': {$ref: '#/components/responses/NotFound'}
  /api/runs/{run_id}/upload-complete:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      operationId: completeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bytes, sha256]
              properties:
                bytes: {type: integer, minimum: 1}
                sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '202':
          description: Object metadata accepted; streaming checksum verification remains queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/runs/{run_id}/face-groups:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      operationId: listFaceGroups
      responses:
        '200':
          description: Temporary opaque face-group previews.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: {type: array, items: {$ref: '#/components/schemas/FaceGroup'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/runs/{run_id}/face-selection:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    put:
      operationId: selectFaceGroups
      description: Enrollment creates one new subject per explicit group and one per ungrouped selected track. Existing-subject destinations are rejected.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_ids]
              properties:
                group_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, format: uuid}
                assignments:
                  type: array
                  items: {$ref: '#/components/schemas/EnrollmentAssignment'}
      responses:
        '202':
          description: Selection locked and matching queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/runs/{run_id}/face-groups/{group_id}/preview:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: group_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getFaceGroupPreview
      responses:
        '200':
          description: Generation-pinned temporary JPEG preview.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {image/jpeg: {schema: {type: string, contentEncoding: binary}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/runs/{run_id}/results:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      operationId: getResults
      responses:
        '200':
          description: Pre-enrollment candidate snapshot.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Results'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/runs/{run_id}/retry:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      operationId: retryRun
      responses:
        '202':
          description: The persisted failed step was requeued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/runs/{run_id}/cancel:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      operationId: cancelRun
      responses:
        '202':
          description: Cancelled or cooperative cancellation requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/gallery/faces/{representative_id}:
    parameters:
      - name: representative_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRepresentativeFace
      responses:
        '200':
          description: Active generation-pinned representative JPEG.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {image/jpeg: {schema: {type: string, contentEncoding: binary}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/subjects/{subject_id}:
    parameters:
      - name: subject_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSubject
      responses:
        '200':
          description: Bounded subject summary and representative gallery.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subject'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: editSubject
      responses:
        '200':
          description: Current result, or the result of an identical operation replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditSubject'
  /api/subjects:
    get:
      operationId: listSubjects
      responses:
        '200':
          description: Current result, or the result of an identical operation replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subject'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: q
        in: query
        description: Exact subject UUID or case-insensitive display-name text. Merged UUIDs resolve to the
          surviving subject.
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: multiple_sources
        in: query
        schema: {type: boolean, default: false}
      - name: sort
        in: query
        schema: {type: string, enum: [id, sources], default: id}
  /api/features:
    get:
      operationId: getFeatures
      responses:
        '200':
          description: Current result, or the result of an identical operation replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject_management:
                    type: boolean
                  enrollment_grouping:
                    type: boolean
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/subjects/{subject_id}/examples:
    parameters:
    - name: subject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSubjectExamples
      responses:
        '200':
          description: Current result, or the result of an identical operation replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  examples:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubjectExample'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
      - name: source_id
        in: query
        schema: {type: string, format: uuid}
  /api/subjects/{subject_id}/sources:
    parameters:
      - name: subject_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listSubjectSources
      responses:
        '200':
          description: Source counts and current subject version for manual correction review.
          content:
            application/json:
              schema:
                type: object
                required: [subject_id, version, sources]
                properties:
                  subject_id: {type: string, format: uuid}
                  version: {type: integer}
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source_id: {type: string, format: uuid}
                        example_count: {type: integer}
                        page_url: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/subjects/{subject_id}/combine:
    parameters:
    - name: subject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: combineSubjects
      responses:
        '200':
          description: Current result, or the result of an identical operation replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectCorrection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CombineSubjects'
  /api/subjects/{subject_id}/move-examples:
    parameters:
    - name: subject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: moveSubjectExamples
      responses:
        '200':
          description: Current result, or the result of an identical operation replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectCorrection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveExamples'
  /api/subjects/{subject_id}/potential-matches:
    parameters:
      - {name: subject_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: findPotentialMatches
      description: Read-only current comparison. Excludes self, merged, empty and incompatible subjects, and applies versioned dismissals before the ten-result limit. Scores are similarity, not identity probability.
      parameters:
        - {name: dismissed, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Current subject version and candidates ordered by descending similarity then UUID.
          content:
            application/json:
              schema:
                type: object
                required: [subject_id, version, dismissed, candidates]
                properties:
                  subject_id: {type: string, format: uuid}
                  version: {type: integer, minimum: 1}
                  dismissed: {type: boolean}
                  candidates:
                    type: array
                    maxItems: 10
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/Subject'}
                        - type: object
                          required: [version, similarity]
                          properties:
                            similarity: {type: number}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/subjects/{subject_id}/potential-matches/{candidate_id}/dismissal:
    parameters:
      - {name: subject_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: candidate_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: dismissPotentialMatch
      description: Dismiss an unordered pair at the supplied current versions. Shared review state records the actor and timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SuggestionReview'}
      responses:
        '200':
          description: Pair review state; no membership or subject versions are changed.
          content:
            application/json:
              schema:
                type: object
                required: [subject_id, candidate_id, version, target_version, dismissed]
                properties:
                  subject_id: {type: string, format: uuid}
                  candidate_id: {type: string, format: uuid}
                  version: {type: integer, minimum: 1}
                  target_version: {type: integer, minimum: 1}
                  dismissed: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      operationId: restorePotentialMatch
      description: Explicitly restore an unordered pair. An identical retry is idempotent; stale subject versions are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SuggestionReview'}
      responses:
        '200':
          description: Pair review state; no membership or subject versions are changed.
          content:
            application/json:
              schema:
                type: object
                required: [subject_id, candidate_id, version, target_version, dismissed]
                properties:
                  subject_id: {type: string, format: uuid}
                  candidate_id: {type: string, format: uuid}
                  version: {type: integer, minimum: 1}
                  target_version: {type: integer, minimum: 1}
                  dismissed: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    iap: {type: openIdConnect, openIdConnectUrl: 'https://cloud.google.com/iap'}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    NoStore: {schema: {type: string, const: no-store}}
    ETag: {schema: {type: string}}
  responses:
    Error:
      description: Request error.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Request conflicts with current state or idempotency payload.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Unknown run.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    SuggestionReview:
      type: object
      additionalProperties: false
      required: [operation_id, version, target_version]
      properties:
        operation_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        target_version: {type: integer, minimum: 1}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [handling_policy, source]
      properties:
        handling_policy:
          type: string
          enum: [search_then_discard, retain_and_enroll, enroll_only]
          description: Enrollment policies are accepted only when the deployment gate is enabled.
        source:
          oneOf:
            - $ref: '#/components/schemas/UrlSource'
            - $ref: '#/components/schemas/UploadSource'
          discriminator: {propertyName: kind}
    UrlSource:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind: {type: string, const: url}
        url: {type: string, format: uri, pattern: '^https://'}
    UploadSource:
      type: object
      additionalProperties: false
      required: [kind, content_type, bytes]
      properties:
        kind: {type: string, const: upload}
        content_type: {type: string, enum: [image/jpeg, image/png, video/mp4]}
        bytes: {type: integer, minimum: 1}
    Run:
      type: object
      required: [run_id, state, handling_policy, status_url, created_at, expires_at]
      properties:
        run_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/RunState'}
        handling_policy: {type: string, enum: [search_then_discard, retain_and_enroll, enroll_only]}
        status_url: {type: string}
        outcome: {type: [string, 'null'], enum: [candidates, no_faces, null]}
        retryable: {type: boolean, default: false}
        error: {$ref: '#/components/schemas/Error'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    RunState:
      type: string
      enum: [awaiting_media, fetching, queued, detecting, awaiting_face_selection, matching, enrolling, succeeded, failed, cancelled, expired]
    FaceGroup:
      type: object
      required: [group_id, preview_url, selected, quality]
      properties:
        group_id: {type: string, format: uuid}
        preview_url: {type: string}
        selected: {type: boolean}
        quality: {type: object}
        time_range_ms:
          type: [object, 'null']
          properties: {start: {type: integer}, end: {type: integer}}
    Results:
      type: object
      required: [run_id, groups]
      properties:
        run_id: {type: string, format: uuid}
        groups:
          type: array
          items:
            type: object
            required: [group_id, candidates]
            properties:
              group_id: {type: string, format: uuid}
              enrollment:
                type: [object, 'null']
                properties:
                  subject_id: {type: string, format: uuid}
                  decision: {type: string, enum: [matched, created]}
                  source_id: {type: string, format: uuid}
              candidates:
                type: array
                items:
                  type: object
                  required: [subject_id, rank, similarity, source_count, observation_count, page_urls, representative_faces, compared_subject_version, subject_version_status]
                  properties:
                    subject_id: {type: string, format: uuid}
                    display_name: {type: [string, 'null']}
                    compared_subject_version: {type: [integer, 'null'], minimum: 1}
                    subject_version_status:
                      type: string
                      enum: [unchanged, changed, unavailable]
                      description: Existing snapshots retain their IDs and scores. Changes use recorded versions or later correction evidence; missing historical evidence is unavailable.
                    rank: {type: integer, minimum: 1}
                    similarity: {type: number}
                    source_count: {type: integer, minimum: 0}
                    observation_count: {type: integer, minimum: 0}
                    page_urls:
                      type: array
                      items: {type: string, format: uri}
                    representative_faces:
                      type: array
                      maxItems: 5
                      items: {$ref: '#/components/schemas/RepresentativeFace'}
    RepresentativeFace:
      type: object
      required: [representative_id, url]
      properties:
        representative_id: {type: string, format: uuid}
        url: {type: string}
        quality_score: {type: [number, 'null']}
        source_timestamp_ms: {type: [integer, 'null']}
    Subject:
      type: object
      required:
      - subject_id
      - model_version
      - sample_count
      - source_count
      - observation_count
      - page_urls
      - representative_faces
      properties:
        subject_id:
          type: string
          format: uuid
        display_name:
          type:
          - string
          - 'null'
        model_version:
          type: string
        sample_count:
          type: integer
          minimum: 0
        source_count:
          type: integer
          minimum: 0
        observation_count:
          type: integer
          minimum: 0
        page_urls:
          type: array
          items:
            type: string
            format: uri
        representative_faces:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RepresentativeFace'
        identity_id:
          type:
          - string
